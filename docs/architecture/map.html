<style>
  html, body { height: 100%; }
  body { background:#08090c; color:#e2e8f0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #27303f; border-radius: 9px; }
  ::-webkit-scrollbar-thumb:hover { background: #3b465a; }
  #canvas { cursor: grab; touch-action: none; }
  #canvas.dragging { cursor: grabbing; }
  .node-card { transition: opacity .18s ease, filter .18s ease; }
  .node-card.dim { opacity: .13; }
  .edge { transition: opacity .18s ease, stroke-width .18s ease; }
  .edge.dim { opacity: .04; }
  .edge.hot { opacity: 1; }
  .flow-edge { stroke-dasharray: 9 7; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -32; } }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }
  .fade-in { animation: fade .22s ease both; }
  @keyframes fade { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform:none;} }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
</style>
</head>
<body class="antialiased overflow-hidden">

<div class="flex flex-col h-screen">

  </header>

  <div class="flex flex-1 min-h-0">

          <ul id="layer-list" class="space-y-0.5"></ul>
        </section>

          <h2 class="text-[10px] font-semibold uppercase tracking-[.12em] text-slate-500 mb-2">Tipo de arista</h2>
          <ul id="kind-list" class="space-y-0.5"></ul>
        </section>

        <section>
          <h2 class="text-[10px] font-semibold uppercase tracking-[.12em] text-slate-500 mb-2">Invariantes</h2>
          <ul id="inv-list" class="space-y-1.5"></ul>
        </section>

      </div>
    </aside>

    <!-- ── Lienzo ───────────────────────────────────────── -->
    <main class="flex-1 relative min-w-0 bg-[#08090c]">
      <svg id="canvas" class="w-full h-full block">
        <defs>
          <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" fill="#161b26"/>
          </pattern>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
          </marker>
          <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="#e2e8f0"/>
          </marker>
          <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z" fill="#fbbf24"/>
          </marker>
        </defs>
        <rect id="grid-bg" width="100%" height="100%" fill="url(#grid)"/>
        <g id="viewport">
          <g id="g-layers"></g>
          <g id="g-edges"></g>
          <g id="g-flow"></g>
          <g id="g-nodes"></g>
        </g>
      </svg>

      <div class="absolute bottom-3 left-3 flex items-center gap-1.5 text-[11px] text-slate-600 bg-[#0b0d12]/90 border border-slate-800/70 rounded-md px-2.5 py-1.5 backdrop-blur">
        <span>Arrastra para mover · rueda para zoom · clic en un nodo para fijarlo</span>
      </div>
      <div id="zoom-badge" class="absolute bottom-3 right-3 text-[11px] text-slate-500 bg-[#0b0d12]/90 border border-slate-800/70 rounded-md px-2 py-1 mono">100%</div>
    </main>

    <!-- ── Panel derecho ────────────────────────────────── -->
    <aside class="w-[22rem] xl:w-[25rem] shrink-0 border-l border-slate-800/80 bg-[#0b0d12] flex flex-col">

      <div class="flex border-b border-slate-800/80 shrink-0">
        <button data-tab="flows"  class="tab flex-1 text-xs py-2.5 font-medium border-b-2 border-amber-400 text-slate-100">Flujos</button>
        <button data-tab="detail" class="tab flex-1 text-xs py-2.5 font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-300 transition">Detalle</button>
      </div>

      <!-- Flujos -->
      <div id="tab-flows" class="flex-1 overflow-y-auto p-3 space-y-2"></div>

      <!-- Detalle -->
      <div id="tab-detail" class="flex-1 overflow-y-auto p-4 hidden"></div>

    </aside>

  </div>
</div>

  "flows": [
    {
      "id": "flow-session",
      "name": "Registrar una sesión (bucle diario)",
      "category": "core",
      "summary": "El flujo más usado de la app: apuntar cuánto has leído/visto. Hace rodar la posición y el estado del PASE, y puede encadenar la hoja de cierre si la sesión completa la obra.",
      "entrypoint": "src/lib/sessions/actions.ts:44",
      "notes": [
        "El passId del formulario debe ser EXACTAMENTE el pase activo ahora mismo: una pestaña vieja apuntando a un pase ya cerrado se rechaza.",
        "Los minutos solo aplican a libros; una server action es un POST público, así que el campo se ignora en servidor, no solo en la UI.",
        "La nota se escribe en DOS tablas y progress_sessions.note tiene CHECK <= 2000 code points; se valida con [...note].length antes de tocar la BD."
      ],
      "steps": [
        {
          "node": "c-session",
          "action": "El usuario abre la hoja de sesión (o la ruta interceptada /sesion/[passId]) y envía posición, minutos y cita",
          "file": "src/components/session"
        },
        {
          "node": "a-sessions",
          "action": "addSession valida el pase activo, la duración y la longitud de la nota",
          "file": "src/lib/sessions/actions.ts:44"
        },
        {
          "node": "m-passes",
          "action": "Si el pase estaba en planned, applyTransition lo mueve a in_progress",
          "file": "src/lib/passes/apply-transition.ts"
        },
        {
          "node": "m-editions",
          "action": "El total de páginas contra el que se valida sale de la EDICIÓN del pase, no de books.total_pages",
          "file": "src/lib/editions/edition-label.ts"
        },
        {
          "node": "m-series",
          "action": "En series, se marca el episodio alcanzado y rueda el progreso",
          "file": "src/lib/series/episode-watch-store.ts"
        },
        {
          "node": "sb-server",
          "action": "Inserta en progress_sessions, actualiza position/status del pase y, si hay cita, escribe en notes",
          "file": "src/lib/supabase/server.ts"
        },
        {
          "node": "t-sessions",
          "action": "Nueva fila colgando del pase"
        },
        {
          "node": "t-passes",
          "action": "position y status del pase actualizados — este es el estado vivo"
        },
        {
          "node": "m-reactivity",
          "action": "revalidateReadingLog(itemType, id) invalida ficha, biblioteca y feed",
          "file": "src/lib/reactivity/revalidate.ts:77"
        },
        {
          "node": "r-ficha",
          "action": "La ficha y el resto de superficies se repintan con datos frescos"
        }
      ]
    },
    {
      "id": "flow-search-open",
      "name": "Buscar y abrir una obra nueva (escalera de hidratación)",
      "category": "core",
      "summary": "Tres peldaños: tarjeta de resultado (solo memoria) → ficha de obra (nace en BD al abrirla) → edición concreta (al registrarla). La búsqueda nunca escribe.",
      "entrypoint": "src/app/buscar/actions.ts:24",
      "notes": [
        "OpenLibrary hace dos llamadas de 5 s de timeout; esperar entera dejaba el clic congelado ~10 s. Se le da un presupuesto de 1200 ms y, si no llega, sigue viva en after().",
        "La red de seguridad final es el curador de la propia ficha: rehidrata cualquier fila con hydrated_at null la próxima vez que se abra.",
        "La tarjeta de resultado NO pinta editorial ni páginas a propósito: son de una tirada concreta, no de la obra."
      ],
      "steps": [
        {
          "node": "r-buscar",
          "action": "El usuario busca; se fusionan catálogo local y resultados de API sin persistir nada",
          "file": "src/lib/catalog/search.ts"
        },
        {
          "node": "m-catalog",
          "action": "mergeResults + titleMatch deciden qué es lo mismo y qué no",
          "file": "src/lib/catalog/merge-results.ts"
        },
        {
          "node": "a-buscar",
          "action": "Clic en el resultado → openCatalogItem. Si ya tiene catalogId, redirige directo",
          "file": "src/app/buscar/actions.ts:24"
        },

<script>
(function () {
  "use strict";

  const G = JSON.parse(document.getElementById('graph-data').textContent);

  // ── Paleta por capa ────────────────────────────────────
  const LAYER_COLOR = {
    client:   '#38bdf8',
    edge:     '#a78bfa',
    route:    '#f472b6',
    ui:       '#fb923c',
    action:   '#fbbf24',
    domain:   '#4ade80',
    data:     '#2dd4bf',
    db:       '#60a5fa',
    external: '#94a3b8',
  };
  const KIND_COLOR = {
    renders: '#f472b6', calls: '#94a3b8', reads: '#60a5fa',
    writes: '#f87171', revalidates: '#4ade80', fetch: '#c084fc', auth: '#a78bfa',
  };

  // ── Layout ─────────────────────────────────────────────
  const NW = 208, NH = 48, COL_W = 300, ROW_H = 64, PAD = 70;

  const layers = [...G.meta.layers].sort((a, b) => a.order - b.order);
  const byLayer = new Map(layers.map(l => [l.id, []]));
  G.nodes.forEach(n => (byLayer.get(n.layer) || []).push(n));

  const maxRows = Math.max(...[...byLayer.values()].map(v => v.length));
  const H = maxRows * ROW_H + PAD * 2;
  const W = layers.length * COL_W + PAD * 2;

  const pos = new Map();
  layers.forEach((l, li) => {
    const list = byLayer.get(l.id) || [];
    const colH = list.length * ROW_H;
    const y0 = PAD + (H - PAD * 2 - colH) / 2;
    list.forEach((n, i) => {
      pos.set(n.id, { x: PAD + li * COL_W, y: y0 + i * ROW_H, layer: l });
    });
  });

  const nodeById = new Map(G.nodes.map(n => [n.id, n]));
  const validEdges = G.edges.filter(e => pos.has(e.from) && pos.has(e.to));

  // Vecindad
  const neighbors = new Map(G.nodes.map(n => [n.id, new Set()]));
  validEdges.forEach(e => { neighbors.get(e.from).add(e.to); neighbors.get(e.to).add(e.from); });

  // ── SVG helpers ────────────────────────────────────────
  const NS = 'http://www.w3.org/2000/svg';
  const el = (t, a = {}) => { const x = document.createElementNS(NS, t); for (const k in a) x.setAttribute(k, a[k]); return x; };

  function path(a, b) {
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
    const dx = x2 - x1;
    if (dx > 20) {
      const c = Math.max(40, dx * 0.45);
      return `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`;
    }
    // arista hacia atrás: sale por la izquierda del origen y entra por la derecha del destino
    const sx = a.x, sy = a.y + NH / 2, tx = b.x + NW, ty = b.y + NH / 2;
    const bow = 90 + Math.abs(sy - ty) * 0.18;
    return `M${sx},${sy} C${sx - bow},${sy} ${tx + bow},${ty} ${tx},${ty}`;
  }

  // ── Bandas de capa ─────────────────────────────────────
  const gLayers = document.getElementById('g-layers');
  layers.forEach((l, li) => {
    const x = PAD + li * COL_W - 22;
    gLayers.appendChild(el('rect', {
      x, y: 24, width: NW + 44, height: H - 24, rx: 14,
      fill: li % 2 ? '#0d1017' : '#0a0c11', stroke: '#141922', 'stroke-width': 1,
    }));
    const t = el('text', { x: x + (NW + 44) / 2, y: 52, 'text-anchor': 'middle',
      fill: LAYER_COLOR[l.id], 'font-size': 11, 'font-weight': 700, 'letter-spacing': '.09em' });
    t.textContent = l.label.toUpperCase();
    gLayers.appendChild(t);
  });

  // ── Aristas ────────────────────────────────────────────
  const gEdges = document.getElementById('g-edges');
  const edgeEls = [];
  validEdges.forEach(e => {
    const p = el('path', {
      d: path(pos.get(e.from), pos.get(e.to)),
      fill: 'none', stroke: KIND_COLOR[e.kind] || '#475569',
      'stroke-width': 1.15, 'stroke-opacity': .34,
      'marker-end': 'url(#arrow)', class: 'edge',
    });
    p.dataset.from = e.from; p.dataset.to = e.to; p.dataset.kind = e.kind;
    if (e.label) { const ttl = el('title'); ttl.textContent = `${e.kind}: ${e.label}`; p.appendChild(ttl); }
    gEdges.appendChild(p); edgeEls.push(p);
  });

  // ── Nodos ──────────────────────────────────────────────
  const gNodes = document.getElementById('g-nodes');
  const nodeEls = new Map();
  G.nodes.forEach(n => {
    const p = pos.get(n.id), c = LAYER_COLOR[n.layer];
    const g = el('g', { class: 'node-card', transform: `translate(${p.x},${p.y})`, style: 'cursor:pointer' });
    g.dataset.id = n.id;

    g.appendChild(el('rect', { width: NW, height: NH, rx: 9,
      fill: n.hub ? '#141a24' : '#101319', stroke: c, 'stroke-opacity': n.hub ? .95 : .42,
      'stroke-width': n.hub ? 1.8 : 1 }));
    g.appendChild(el('rect', { width: 3.5, height: NH, rx: 2, fill: c, 'fill-opacity': .95 }));

    const label = el('text', { x: 13, y: n.frozen || n.hub ? 20 : 25, fill: '#e6edf6',
      'font-size': 11.5, 'font-weight': 600 });
    label.textContent = n.label.length > 30 ? n.label.slice(0, 29) + '…' : n.label;
    g.appendChild(label);

    const sub = el('text', { x: 13, y: n.frozen || n.hub ? 33 : 38, fill: '#64748b', 'font-size': 9.5 });
    sub.textContent = (n.files && n.files[0]) ? n.files[0].replace(/^src\//, '') : n.kind;
    if (sub.textContent.length > 36) sub.textContent = sub.textContent.slice(0, 35) + '…';
    g.appendChild(sub);

    if (n.hub || n.frozen) {
      const tag = el('text', { x: 13, y: 44, fill: n.frozen ? '#f87171' : '#fbbf24',
        'font-size': 8.5, 'font-weight': 700, 'letter-spacing': '.08em' });
      tag.textContent = n.frozen ? 'CONGELADA' : 'HUB';
      g.appendChild(tag);
    }

    // Badge de paso de flujo
    const badge = el('g', { class: 'step-badge', style: 'display:none' });
    badge.appendChild(el('circle', { cx: NW - 15, cy: 15, r: 11, fill: '#fbbf24' }));
    const bt = el('text', { x: NW - 15, y: 19, 'text-anchor': 'middle', fill: '#1c1408',
      'font-size': 10.5, 'font-weight': 800 });
    badge.appendChild(bt);
    g.appendChild(badge);

    const ttl = el('title'); ttl.textContent = n.summary || n.label; g.appendChild(ttl);

    gNodes.appendChild(g);
    nodeEls.set(n.id, { g, badge, badgeText: bt });
  });

  // ── Pan / zoom ─────────────────────────────────────────
  const svg = document.getElementById('canvas');
  const vp = document.getElementById('viewport');
  const zoomBadge = document.getElementById('zoom-badge');
  let view = { x: 0, y: 0, k: 1 };

  function applyView() {
    vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
    zoomBadge.textContent = Math.round(view.k * 100) + '%';
  }
  let fitted = false;
  function fit() {
    const r = svg.getBoundingClientRect();
    // Si el lienzo aún no tiene tamaño (pestaña oculta, panel plegado, impresión),
    // un fit aquí daría scale(0) y la página se vería en blanco para siempre.
    // Se deja pendiente y lo reintenta el ResizeObserver de abajo.
    if (r.width < 40 || r.height < 40) return false;
    const k = Math.min(r.width / (W + 40), r.height / (H + 40), 1.4);
    view = { k, x: (r.width - W * k) / 2, y: (r.height - H * k) / 2 };
    applyView();
    fitted = true;
    return true;
  }
  function focusNode(id, k) {
    const p = pos.get(id); if (!p) return;
    const r = svg.getBoundingClientRect();
    view.k = k || Math.max(view.k, .85);
    view.x = r.width / 2 - (p.x + NW / 2) * view.k;
    view.y = r.height / 2 - (p.y + NH / 2) * view.k;
    applyView();
  }

  let drag = null;
  svg.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
    svg.classList.add('dragging'); svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    view.x = drag.vx + dx; view.y = drag.vy + dy; applyView();
  });
  svg.addEventListener('pointerup', () => { svg.classList.remove('dragging'); setTimeout(() => { drag = null; }, 0); });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    const nk = Math.min(2.6, Math.max(.18, view.k * f));
    view.x = mx - (mx - view.x) * (nk / view.k);
    view.y = my - (my - view.y) * (nk / view.k);
    view.k = nk; applyView();
  }, { passive: false });

  // ── Estado de resaltado ────────────────────────────────
  let pinned = null;     // id de nodo fijado
  let activeFlow = null; // objeto flow
  let mutedKinds = new Set();

  function clearHighlight() {
    nodeEls.forEach(({ g, badge }) => { g.classList.remove('dim'); badge.style.display = 'none'; });
    edgeEls.forEach(p => {
      p.classList.remove('dim', 'hot');
      p.setAttribute('stroke-width', 1.15);
      p.setAttribute('stroke-opacity', mutedKinds.has(p.dataset.kind) ? .04 : .34);
      p.setAttribute('marker-end', 'url(#arrow)');
    });
    document.getElementById('g-flow').innerHTML = '';
  }

  function highlightNode(id) {
    clearHighlight();
    const near = neighbors.get(id) || new Set();
    nodeEls.forEach((v, k) => { if (k !== id && !near.has(k)) v.g.classList.add('dim'); });
    edgeEls.forEach(p => {
      const on = p.dataset.from === id || p.dataset.to === id;
      if (on) { p.classList.add('hot'); p.setAttribute('stroke-width', 2.1); p.setAttribute('stroke-opacity', .95); p.setAttribute('marker-end', 'url(#arrow-hot)'); }
      else p.classList.add('dim');
    });
  }

  function renderFlow(flow) {
    clearHighlight();
    const ids = flow.steps.map(s => s.node).filter(x => pos.has(x));
    const set = new Set(ids);
    nodeEls.forEach((v, k) => { if (!set.has(k)) v.g.classList.add('dim'); });

    // badges: puede repetirse un nodo en varios pasos
    const stepsPerNode = new Map();
    flow.steps.forEach((s, i) => {
      if (!pos.has(s.node)) return;
      if (!stepsPerNode.has(s.node)) stepsPerNode.set(s.node, []);
      stepsPerNode.get(s.node).push(i + 1);
    });
    stepsPerNode.forEach((nums, id) => {
      const v = nodeEls.get(id);
      v.badgeText.textContent = nums.length > 1 ? nums[0] + '+' : nums[0];
      v.badge.style.display = '';
    });

    // camino
    const gf = document.getElementById('g-flow');
    for (let i = 0; i < ids.length - 1; i++) {
      if (ids[i] === ids[i + 1]) continue;
      gf.appendChild(el('path', {
        d: path(pos.get(ids[i]), pos.get(ids[i + 1])),
        fill: 'none', stroke: '#fbbf24', 'stroke-width': 2.4, 'stroke-opacity': .9,
        'marker-end': 'url(#arrow-flow)', class: 'flow-edge',
      }));
    }
    edgeEls.forEach(p => p.classList.add('dim'));
  }

  // ── Panel de detalle ───────────────────────────────────
  const tabFlows = document.getElementById('tab-flows');
  const tabDetail = document.getElementById('tab-detail');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function showTab(name) {
    document.querySelectorAll('.tab').forEach(b => {
      const on = b.dataset.tab === name;
      b.classList.toggle('border-amber-400', on);
      b.classList.toggle('border-transparent', !on);
      b.classList.toggle('text-slate-100', on);
      b.classList.toggle('text-slate-500', !on);
    });
    tabFlows.classList.toggle('hidden', name !== 'flows');
    tabDetail.classList.toggle('hidden', name !== 'detail');
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

  function renderDetail(id) {
    const n = nodeById.get(id);
    const layer = layers.find(l => l.id === n.layer);
    const color = LAYER_COLOR[n.layer];
    const out = validEdges.filter(e => e.from === id);
    const inc = validEdges.filter(e => e.to === id);
    const flowsWith = G.flows.filter(f => f.steps.some(s => s.node === id));

    const linkList = (arr, dir) => arr.length ? `<ul class="space-y-1">${arr.map(e => {
      const other = nodeById.get(dir === 'out' ? e.to : e.from);
      return `<li><button data-goto="${other.id}" class="w-full text-left group flex items-start gap-2 text-[11px] hover:bg-slate-800/50 rounded px-1.5 py-1 transition">
        <span class="mt-[3px] w-1.5 h-1.5 rounded-full shrink-0" style="background:${KIND_COLOR[e.kind] || '#475569'}"></span>
        <span class="text-slate-300 group-hover:text-white">${esc(other.label)}</span>
        <span class="ml-auto text-slate-600 shrink-0">${esc(e.kind)}</span>
      </button></li>`; }).join('')}</ul>` : '<p class="text-[11px] text-slate-600 px-1.5">—</p>';

    tabDetail.innerHTML = `
      <div class="fade-in space-y-4">
        <div>
          <div class="flex items-center gap-2 mb-1.5">
            <span class="w-2 h-2 rounded-full" style="background:${color}"></span>
            <span class="text-[10px] uppercase tracking-[.12em] font-semibold" style="color:${color}">${esc(layer.label)}</span>
            ${n.hub ? '<span class="text-[9px] font-bold tracking-wider text-amber-400 border border-amber-400/40 rounded px-1.5 py-px">HUB</span>' : ''}
            ${n.frozen ? '<span class="text-[9px] font-bold tracking-wider text-red-400 border border-red-400/40 rounded px-1.5 py-px">CONGELADA</span>' : ''}
          </div>
          <h3 class="text-base font-semibold text-slate-100 leading-snug">${esc(n.label)}</h3>
          <p class="text-[12.5px] text-slate-400 leading-relaxed mt-2">${esc(n.summary || '')}</p>
        </div>

        ${n.gotchas ? `<div class="rounded-lg border border-amber-500/25 bg-amber-500/[.06] p-3">
          <p class="text-[10px] uppercase tracking-[.12em] font-semibold text-amber-400 mb-1.5">Trampas</p>
          <ul class="space-y-1.5">${n.gotchas.map(g => `<li class="text-[11.5px] text-amber-100/80 leading-relaxed">${esc(g)}</li>`).join('')}</ul>
        </div>` : ''}

        ${n.columns ? `<div>
          <p class="text-[10px] uppercase tracking-[.12em] font-semibold text-slate-500 mb-1.5">Columnas clave</p>
          <div class="flex flex-wrap gap-1">${n.columns.map(c => `<code class="mono text-[10.5px] bg-slate-800/70 text-slate-300 rounded px-1.5 py-0.5">${esc(c)}</code>`).join('')}</div>
        </div>` : ''}

        ${n.files ? `<div>
          <p class="text-[10px] uppercase tracking-[.12em] font-semibold text-slate-500 mb-1.5">Ficheros</p>
          <ul class="space-y-0.5">${n.files.map(f => `<li class="mono text-[11px] text-sky-300/85 break-all">${esc(f)}</li>`).join('')}</ul>
        </div>` : ''}

        <div>
          <p class="text-[10px] uppercase tracking-[.12em] font-semibold text-slate-500 mb-1.5">Depende de (${out.length})</p>
          ${linkList(out, 'out')}
        </div>
        <div>
          <p class="text-[10px] uppercase tracking-[.12em] font-semibold text-slate-500 mb-1.5">Lo usan (${inc.length})</p>
          ${linkList(inc, 'in')}
        </div>

        ${flowsWith.length ? `<div>
          <p class="text-[10px] uppercase tracking-[.12em] font-semibold text-slate-500 mb-1.5">Aparece en flujos</p>
          <div class="flex flex-wrap gap-1.5">${flowsWith.map(f => `<button data-flow="${f.id}" class="text-[11px] rounded-md border border-slate-700 bg-slate-900 hover:border-amber-400/60 hover:text-amber-300 text-slate-300 px-2 py-1 transition">${esc(f.name)}</button>`).join('')}</div>
        </div>` : ''}
      </div>`;

    tabDetail.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => selectNode(b.dataset.goto, true)));
    tabDetail.querySelectorAll('[data-flow]').forEach(b => b.addEventListener('click', () => selectFlow(b.dataset.flow)));
  }

  function selectNode(id, doFocus) {
    pinned = id; activeFlow = null;
    document.querySelectorAll('[data-flowcard]').forEach(c => c.classList.remove('ring-1', 'ring-amber-400/70'));
    highlightNode(id);
    renderDetail(id);
    showTab('detail');
    if (doFocus) focusNode(id);
  }

  // ── Lista de flujos ────────────────────────────────────
  const CAT_LABEL = { core: 'Núcleo', social: 'Social', sagas: 'Sagas', clubs: 'Clubes', onboarding: 'Entrada', plataforma: 'Plataforma' };
  const CAT_COLOR = { core: '#4ade80', social: '#f472b6', sagas: '#a78bfa', clubs: '#38bdf8', onboarding: '#fbbf24', plataforma: '#94a3b8' };

  G.flows.forEach(f => {
    const card = document.createElement('div');
    card.dataset.flowcard = f.id;
    card.className = 'rounded-lg border border-slate-800 bg-slate-900/40 overflow-hidden transition';
    card.innerHTML = `
      <button data-open="${f.id}" class="w-full text-left px-3 py-2.5 hover:bg-slate-800/40 transition">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-[9.5px] font-bold uppercase tracking-[.1em]" style="color:${CAT_COLOR[f.category] || '#94a3b8'}">${esc(CAT_LABEL[f.category] || f.category)}</span>
          <span class="ml-auto text-[10px] text-slate-600 mono">${f.steps.length} pasos</span>
        </div>
        <div class="text-[13px] font-semibold text-slate-100 leading-snug">${esc(f.name)}</div>
        <div class="text-[11.5px] text-slate-500 leading-relaxed mt-1">${esc(f.summary)}</div>
      </button>
      <div data-body="${f.id}" class="hidden border-t border-slate-800 px-3 py-3 space-y-3"></div>`;
    tabFlows.appendChild(card);
    card.querySelector('[data-open]').addEventListener('click', () => selectFlow(f.id));
  });

  function selectFlow(id) {
    const f = G.flows.find(x => x.id === id);
    if (!f) return;
    showTab('flows');

    // colapsa el resto
    document.querySelectorAll('[data-flowcard]').forEach(c => {
      const on = c.dataset.flowcard === id;
      c.classList.toggle('ring-1', on); c.classList.toggle('ring-amber-400/70', on);
      c.classList.toggle('border-amber-400/40', on);
      c.querySelector('[data-body]').classList.toggle('hidden', !on);
    });

    if (activeFlow && activeFlow.id === id) { // toggle off
      activeFlow = null; clearHighlight();
      document.querySelectorAll('[data-flowcard]').forEach(c => {
        c.classList.remove('ring-1', 'ring-amber-400/70', 'border-amber-400/40');
        c.querySelector('[data-body]').classList.add('hidden');
      });
      return;
    }

    activeFlow = f; pinned = null;
    renderFlow(f);

    const body = document.querySelector(`[data-body="${id}"]`);
    body.innerHTML = `
      ${f.entrypoint ? `<div><p class="text-[10px] uppercase tracking-[.12em] font-semibold text-slate-500 mb-1">Punto de entrada</p>
        <code class="mono text-[11px] text-sky-300/85 break-all">${esc(f.entrypoint)}</code></div>` : ''}
      <ol class="space-y-1">${f.steps.map((s, i) => {
        const n = nodeById.get(s.node);
        const c = n ? LAYER_COLOR[n.layer] : '#64748b';
        return `<li><button data-step="${s.node}" class="w-full text-left flex gap-2.5 rounded-md px-2 py-1.5 hover:bg-slate-800/60 transition group">
          <span class="shrink-0 mt-px w-5 h-5 rounded-full bg-amber-400 text-[10px] font-extrabold text-amber-950 grid place-items-center">${i + 1}</span>
          <span class="min-w-0">
            <span class="block text-[11px] font-semibold" style="color:${c}">${esc(n ? n.label : s.node)}</span>
            <span class="block text-[11.5px] text-slate-300 leading-relaxed group-hover:text-slate-100">${esc(s.action)}</span>
            ${s.file ? `<span class="block mono text-[10px] text-slate-500 break-all mt-0.5">${esc(s.file)}</span>` : ''}
          </span>
        </button></li>`; }).join('')}</ol>
      ${f.notes ? `<div class="rounded-lg border border-slate-700/70 bg-slate-800/30 p-2.5">
        <p class="text-[10px] uppercase tracking-[.12em] font-semibold text-slate-500 mb-1.5">Notas</p>
        <ul class="space-y-1.5">${f.notes.map(x => `<li class="text-[11.5px] text-slate-400 leading-relaxed">${esc(x)}</li>`).join('')}</ul>
      </div>` : ''}`;

    body.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => focusNode(b.dataset.step, Math.max(view.k, .9))));

    // encuadra el flujo
    const pts = f.steps.map(s => pos.get(s.node)).filter(Boolean);
    if (pts.length) {
      const minX = Math.min(...pts.map(p => p.x)), maxX = Math.max(...pts.map(p => p.x + NW));
      const minY = Math.min(...pts.map(p => p.y)), maxY = Math.max(...pts.map(p => p.y + NH));
      const r = svg.getBoundingClientRect();
      const k = Math.min(r.width / (maxX - minX + 160), r.height / (maxY - minY + 160), 1.1);
      view.k = k;
      view.x = r.width / 2 - (minX + maxX) / 2 * k;
      view.y = r.height / 2 - (minY + maxY) / 2 * k;
      applyView();
    }
  }

  // ── Interacción con nodos ──────────────────────────────
  nodeEls.forEach(({ g }, id) => {
    g.addEventListener('mouseenter', () => { if (!pinned && !activeFlow) highlightNode(id); });
    g.addEventListener('mouseleave', () => { if (!pinned && !activeFlow) clearHighlight(); });
    g.addEventListener('click', e => { e.stopPropagation(); if (drag && drag.moved) return; selectNode(id); });
  });
  svg.addEventListener('click', () => {
    if (drag && drag.moved) return;
    if (pinned) { pinned = null; clearHighlight(); }
  });

  // ── Sidebar: capas, tipos, invariantes ─────────────────
  const layerList = document.getElementById('layer-list');
  layers.forEach(l => {
    const li = document.createElement('li');
    li.innerHTML = `<div class="flex items-start gap-2 px-1.5 py-1 rounded hover:bg-slate-800/40 transition">
      <span class="mt-[5px] w-2 h-2 rounded-full shrink-0" style="background:${LAYER_COLOR[l.id]}"></span>
      <span class="min-w-0"><span class="block text-[11.5px] font-medium text-slate-200">${esc(l.label)}</span>
      <span class="block text-[10.5px] text-slate-600 leading-snug">${esc(l.description)}</span></span>
      <span class="ml-auto text-[10px] text-slate-600 mono shrink-0">${(byLayer.get(l.id) || []).length}</span></div>`;
    layerList.appendChild(li);
  });

  const kindList = document.getElementById('kind-list');
  Object.entries(G.meta.edgeKinds).forEach(([k, label]) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'w-full flex items-center gap-2 px-1.5 py-1 rounded hover:bg-slate-800/40 transition text-left';
    btn.innerHTML = `<span class="w-4 h-0.5 rounded shrink-0" style="background:${KIND_COLOR[k]}"></span>
      <span class="text-[11.5px] text-slate-300">${esc(label)}</span>
      <span class="ml-auto text-[10px] text-slate-600 mono">${validEdges.filter(e => e.kind === k).length}</span>`;
    btn.addEventListener('click', () => {
      if (mutedKinds.has(k)) mutedKinds.delete(k); else mutedKinds.add(k);
      btn.style.opacity = mutedKinds.has(k) ? .35 : 1;
      if (pinned) highlightNode(pinned); else if (activeFlow) renderFlow(activeFlow); else clearHighlight();
    });
    li.appendChild(btn); kindList.appendChild(li);
  });

  const invList = document.getElementById('inv-list');
  G.meta.invariants.forEach(inv => {
    const li = document.createElement('li');
    li.innerHTML = `<details class="rounded-md border border-slate-800 bg-slate-900/40">
      <summary class="px-2 py-1.5 text-[11px] text-slate-300 hover:text-white">${esc(inv.rule.split('.')[0])}.</summary>
      <div class="px-2 pb-2 space-y-1">
        <p class="text-[11px] text-slate-400 leading-relaxed">${esc(inv.rule)}</p>
        <p class="mono text-[10px] text-sky-300/70 break-all">${esc(inv.evidence)}</p>
        ${inv.exception ? `<p class="text-[10px] text-amber-300/80 leading-relaxed">Excepción: ${esc(inv.exception)}</p>` : ''}
        ${inv.brokenBy ? `<p class="text-[10px] text-red-400/80">Ya se rompió en:${esc(inv.brokenBy)}</p>` : ''}
      </div></details>`;
    invList.appendChild(li);
  });

  // ── Buscador ───────────────────────────────────────────
  const search = document.getElementById('search');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    if (!q) { if (!pinned && !activeFlow) clearHighlight(); return; }
    const hit = G.nodes.filter(n => (n.label + ' ' + (n.summary || '') + ' ' + (n.files || []).join(' ')).toLowerCase().includes(q));
    const set = new Set(hit.map(n => n.id));
    clearHighlight();
    nodeEls.forEach((v, k) => { if (!set.has(k)) v.g.classList.add('dim'); });
    edgeEls.forEach(p => p.classList.add('dim'));
  });
  search.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = search.value.trim().toLowerCase();
    const hit = G.nodes.find(n => n.label.toLowerCase().includes(q));
    if (hit) selectNode(hit.id, true);
  });

  document.getElementById('btn-fit').addEventListener('click', fit);
  document.getElementById('btn-reset').addEventListener('click', () => {
    pinned = null; activeFlow = null; search.value = '';
    document.querySelectorAll('[data-flowcard]').forEach(c => {
      c.classList.remove('ring-1', 'ring-amber-400/70', 'border-amber-400/40');
      c.querySelector('[data-body]').classList.add('hidden');
    });
    clearHighlight(); showTab('flows'); fit();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('btn-reset').click();
    if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); }
  });

  document.getElementById('meta-line').textContent =
    `${G.nodes.length} nodos · ${validEdges.length} aristas · ${G.flows.length} flujos · derivado del código el ${G.meta.generatedAt}`;

  // Reintenta el encuadre inicial en cuanto el lienzo tenga tamaño real.
  if (!fit() && typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => { if (!fitted && fit()) ro.disconnect(); });
    ro.observe(svg);
  }
})();
</script>
</body>
</html>
