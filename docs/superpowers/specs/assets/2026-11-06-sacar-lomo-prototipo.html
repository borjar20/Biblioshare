<meta charset="utf-8">
<title>Sacar un lomo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: Inicio de escritorio de fondo; la partida es un escenario espresso fijo encima.
   La estantería es la protagonista: un mueble de dos baldas con todos tus pendientes; los
   controles viven plegados en una píldora «Afinar». */
:root {
  --home-bg: #f6f1ea; --home-fg: #2b241e; --home-muted: #8a7d6e; --home-card: #fffaf3; --home-line: #e6dccd; --home-accent: #b8653a;
  --st-bg: #17110d; --st-panel: #241d18; --st-raise: #2f2620; --st-line: rgba(240,232,219,.12);
  --st-fg: #f0e8db; --st-muted: #a99e8c; --st-cta: #d98a5c; --st-cta-ink: #1f1409; --st-gold: #e0a94a;
  --wood: #5b3e27; --wood-dk: #3a2717; --wood-lt: #7d5737; --back: #1c130c;
  --book: #cf8a54; --movie: #6bb0b4; --series: #b592bd;
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --home-bg: #17130f; --home-fg: #efe6d8; --home-muted: #a29583; --home-card: #211b16; --home-line: #352c24; --home-accent: #e09a6d; color-scheme: dark } }
:root[data-theme="dark"] { --home-bg: #17130f; --home-fg: #efe6d8; --home-muted: #a29583; --home-card: #211b16; --home-line: #352c24; --home-accent: #e09a6d; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--home-bg); color: var(--home-fg); font-family: var(--f-body); font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, a:focus-visible { outline: 2px solid var(--st-gold); outline-offset: 2px }

/* ---------- Inicio (fondo) ---------- */
.proto-note { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--home-muted);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--home-line); display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between }
.home { max-width: 1180px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.home h1 { font-family: var(--f-display); font-weight: 600; font-size: 30px; margin: 0 0 22px; text-wrap: balance }
.home-grid { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1.6fr); gap: 28px }
@media (max-width: 860px) { .home-grid { grid-template-columns: minmax(0,1fr) } }
.eyebrow { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--home-muted) }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.now { display: flex; flex-direction: column; gap: 10px }
.now-card { display: flex; gap: 14px; align-items: center; background: var(--home-card); border: 1px solid var(--home-line); border-radius: 14px; padding: 12px }
.now-card .cover { width: 54px; flex: none }
.now-card b { font-family: var(--f-display); font-weight: 600; font-size: 16px; display: block }
.now-card small { color: var(--home-muted) }
.bar { height: 4px; border-radius: 4px; background: var(--home-line); margin-top: 8px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--home-accent) }
.now-card.fresh { animation: freshIn 1.6s ease-out }
@keyframes freshIn { 0% { transform: scale(.96); box-shadow: 0 0 0 3px var(--st-gold) } 60% { box-shadow: 0 0 0 3px var(--st-gold) } 100% { transform: none; box-shadow: none } }
.later-head { display: flex; justify-content: space-between; align-items: center }
.later-head a { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--home-accent); text-decoration: none }
.later { display: flex; flex-wrap: wrap; gap: 12px }
.later .item { text-decoration: none; color: inherit; width: 78px; display: flex; flex-direction: column; gap: 5px }
.later .item span { font-size: 11px; line-height: 1.25; color: var(--home-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.week { background: var(--home-card); border: 1px solid var(--home-line); border-radius: 14px; padding: 14px; display: flex; gap: 6px; align-items: end; height: 92px }
.week i { flex: 1; background: color-mix(in srgb, var(--home-accent) 55%, transparent); border-radius: 3px 3px 0 0 }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; transition: .35s;
  background: var(--home-fg); color: var(--home-bg); border-radius: 999px; padding: 10px 18px; font-weight: 500; pointer-events: none; max-width: calc(100% - 32px) }
.toast.on { transform: translate(-50%, 0); opacity: 1 }

/* Portada generada (el prototipo no carga imágenes externas) */
.cover { aspect-ratio: 2/3; border-radius: 6px; position: relative; overflow: hidden; max-width: 100%;
  background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: 0 6px 14px -8px rgba(0,0,0,.55); }
.cover::before { content: ""; position: absolute; inset: 0; background:
  radial-gradient(120% 60% at 20% 0%, rgba(255,255,255,.22), transparent 60%),
  repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 7px); }
.cover .ct { position: absolute; left: 8%; right: 8%; top: 12%; font-family: var(--f-display); font-weight: 600; color: rgba(255,250,242,.95);
  font-size: var(--cfs, 9px); line-height: 1.12; text-wrap: balance; text-shadow: 0 1px 2px rgba(0,0,0,.3) }
.cover .ca { position: absolute; left: 8%; right: 8%; bottom: 9%; font-family: var(--f-mono); font-size: calc(var(--cfs, 9px) * .62); letter-spacing: .08em; text-transform: uppercase; color: rgba(255,250,242,.7) }

/* El lomo-botón: casilla final de «Para más tarde» */
.draw-btn { width: 78px; background: none; border: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; align-items: stretch; text-align: left }
.draw-btn .stack { aspect-ratio: 2/3; border-radius: 6px; border: 1.5px dashed color-mix(in srgb, var(--home-accent) 55%, transparent);
  background: color-mix(in srgb, var(--home-accent) 7%, var(--home-card)); position: relative; overflow: hidden }
.draw-btn .sp { position: absolute; bottom: 14%; width: 15px; border-radius: 3px 3px 2px 2px; transform-origin: bottom center;
  transition: transform .45s cubic-bezier(.34,1.56,.64,1); box-shadow: 0 3px 6px -3px rgba(0,0,0,.5) }
.draw-btn .sp:nth-of-type(1) { height: 56%; background: var(--book); left: calc(50% - 26px); transform: rotate(-9deg) }
.draw-btn .sp:nth-of-type(2) { height: 66%; background: var(--movie); left: calc(50% - 7.5px) }
.draw-btn .sp:nth-of-type(3) { height: 50%; background: var(--series); left: calc(50% + 11px); transform: rotate(8deg) }
.draw-btn .q { position: absolute; top: 10%; left: 0; right: 0; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--home-accent); transition: transform .3s }
.draw-btn > span { font-family: var(--f-display); font-weight: 600; font-size: 12px; color: var(--home-accent) }
.draw-btn:hover .sp:nth-of-type(1), .draw-btn:focus-visible .sp:nth-of-type(1) { transform: rotate(-24deg) translateX(-4px) }
.draw-btn:hover .sp:nth-of-type(2), .draw-btn:focus-visible .sp:nth-of-type(2) { transform: translateY(-16px) }
.draw-btn:hover .sp:nth-of-type(3), .draw-btn:focus-visible .sp:nth-of-type(3) { transform: rotate(22deg) translateX(4px) }
.draw-btn:hover .q, .draw-btn:focus-visible .q { transform: scale(1.15) rotate(-6deg) }

/* ---------- Escenario ---------- */
dialog.stage { margin: auto; padding: 0; border: 1px solid var(--st-line); background: var(--st-bg); color: var(--st-fg);
  width: min(860px, 100vw); max-width: 100vw; max-height: 100dvh; border-radius: 22px; overflow: hidden; }
dialog.stage::backdrop { background: rgba(10,7,5,.62); backdrop-filter: blur(3px) }
@media (max-width: 640px) { dialog.stage { width: 100vw; height: 100dvh; border-radius: 0; border: 0 } }
.st { display: flex; flex-direction: column; height: min(740px, 100dvh); position: relative; --rowh: 140px; --k: 1.3; --petsz: 150px }
@media (max-width: 640px) { .st { height: 100dvh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --rowh: 112px; --k: .72; --petsz: 112px } }
.st.compact { --rowh: 96px }
@media (max-width: 640px) { .st.compact { --rowh: 80px } }
.st-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 0; position: relative; z-index: 12 }
.st-head h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 20px }
.st-head .phase { font-family: var(--f-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--st-muted); margin-left: 12px }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--st-line); background: var(--st-panel); display: grid; place-items: center; font-size: 14px }
.ghost { background: none; border: 0; color: var(--st-muted); font-size: 12px; text-decoration: underline; text-underline-offset: 3px }

/* Telón */
.curtain { position: absolute; inset: 0; z-index: 30; pointer-events: none; display: flex }
.curtain i { flex: 1; background: repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 6px, transparent 6px 26px), linear-gradient(180deg, #7a2a22, #4f1913);
  transition: transform .75s cubic-bezier(.7,0,.3,1) }
.curtain.open i:first-of-type { transform: translateX(-102%) }
.curtain.open i:last-of-type { transform: translateX(102%) }
.curtain.gone { visibility: hidden }
.curtain .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 26px; font-weight: 600; color: #f4d9b6; transition: opacity .3s }
.curtain.open .lbl { opacity: 0 }

/* Habitación: luz de lámpara, motas de polvo, suelo */
.scene { position: relative; flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; padding: 0 24px 26px; overflow: hidden }
.glow { position: absolute; inset: 0; pointer-events: none; background:
  radial-gradient(520px 340px at 18% 8%, rgba(255,176,96,.20), transparent 70%),
  radial-gradient(400px 260px at 85% 90%, rgba(224,169,74,.07), transparent 70%); animation: flicker 6s ease-in-out infinite }
@keyframes flicker { 50% { opacity: .82 } 53% { opacity: .95 } }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: linear-gradient(180deg, #2b1d13, #150e09);
  box-shadow: 0 -1px 0 rgba(255,220,180,.06) }
.motes { position: absolute; inset: 0; pointer-events: none; z-index: 1 }
.motes i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgba(255,226,180,.55); filter: blur(.4px); animation: mote linear infinite }
@keyframes mote { from { transform: translate(0, 0); opacity: 0 } 15% { opacity: .9 } to { transform: translate(var(--dx), -220px); opacity: 0 } }

/* El mueble */
.case { position: relative; z-index: 2; width: min(100%, 640px); padding: 12px 12px 0; border-radius: 6px 6px 2px 2px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 11px), linear-gradient(180deg, var(--wood-lt), var(--wood) 30%, var(--wood-dk));
  box-shadow: 0 30px 40px -24px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,230,200,.18); transition: filter .5s }
.case::before { content: ""; position: absolute; left: -8px; right: -8px; top: -10px; height: 12px; border-radius: 4px 4px 0 0;
  background: linear-gradient(180deg, #8a6140, var(--wood)); box-shadow: 0 3px 6px rgba(0,0,0,.5) }
.case.dim .rows, .case.dim::before { filter: brightness(.3) saturate(.6) blur(1.5px) }
.case.dim { background: linear-gradient(180deg, #33231a, #21160e) }
.rows { display: flex; flex-direction: column; transition: filter .5s }
.row { position: relative; height: var(--rowh); display: flex; align-items: flex-end; gap: 2px; padding: 0 10px; transition: height .5s;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 1px, transparent 1px 72px), linear-gradient(180deg, #120c07, var(--back) 40%, #2a1c11);
  box-shadow: inset 0 22px 24px -14px rgba(0,0,0,.9), inset 10px 0 14px -10px rgba(0,0,0,.8), inset -10px 0 14px -10px rgba(0,0,0,.8) }
.lip { height: 12px; margin: 0 -4px; position: relative; z-index: 3; border-radius: 1px;
  background: linear-gradient(180deg, #9a6c45, var(--wood-lt) 35%, var(--wood) 70%, var(--wood-dk)); box-shadow: 0 7px 10px -4px rgba(0,0,0,.8) }

/* Lomos: grosor = tiempo a tu ritmo; forma según tipo */
.bk { flex: none; position: relative; width: calc(var(--w) * var(--k)); height: var(--h); border-radius: 3px 3px 1px 1px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 62%, #000) 0, var(--c) 16%, color-mix(in srgb, var(--c) 82%, #fff) 38%, var(--c) 60%, color-mix(in srgb, var(--c) 58%, #000) 100%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), 2px 0 3px -1px rgba(0,0,0,.55);
  display: flex; flex-direction: column; align-items: center; padding: 7px 0 6px; transition: transform .35s cubic-bezier(.3,1.3,.5,1), opacity .4s, filter .4s; transform-origin: bottom center }
.bk .tt { flex: 1; min-height: 0; writing-mode: vertical-rl; font-family: var(--f-display); font-weight: 600; font-size: calc(11px * var(--k)); letter-spacing: .01em;
  color: rgba(255,248,236,.92); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 5px 0; text-shadow: 0 1px 1px rgba(0,0,0,.35) }
.bk .band { width: 100%; height: calc(3px * var(--k) + 1px); background: linear-gradient(90deg, #7a5a22, #ecc97a, #7a5a22); opacity: .9; flex: none }
.bk .band + .band { margin-top: 3px }
.bk .au { font-family: var(--f-mono); font-size: calc(8px * var(--k)); color: rgba(255,240,215,.75); letter-spacing: .04em; flex: none }
.bk.movie { border-radius: 2px }
.bk.movie::before { content: ""; position: absolute; left: 22%; width: 12%; top: 0; bottom: 0; background: rgba(255,255,255,.13) }
.bk.movie .cap { width: 100%; height: 13%; background: rgba(0,0,0,.42); flex: none; display: grid; place-items: center; font-size: calc(8px * var(--k)); color: rgba(255,255,255,.7); margin-top: -7px }
.bk.series { border-radius: 2px }
.bk.series::after { content: ""; position: absolute; inset: 0 5px; border-left: 1px solid rgba(0,0,0,.3); border-right: 1px solid rgba(0,0,0,.3); pointer-events: none }
.bk.series .au { background: rgba(0,0,0,.3); border-radius: 2px; padding: 1px 3px }
.bk.lean { transform: rotate(-7deg); margin-left: 9px }
.bk.off { opacity: .2; filter: grayscale(.7) }
.bk.tick { transform: translateY(-10%); filter: brightness(1.35) }
.bk.lean.tick { transform: rotate(-7deg) translateY(-10%) }
.bk.pulled { transform: translateY(-34%) !important; filter: brightness(1.3) drop-shadow(0 0 10px rgba(224,169,74,.7)) }
.bk.taken { transform: translateY(-120%) scale(.6) !important; opacity: 0 }
.scene.choosing .bk:not(.off):hover { transform: translateY(-6%) }

/* Atrezo */
.dc { flex: none; position: relative; align-self: flex-end }
.plant { width: calc(46px * var(--k)); height: 70% }
.plant .pot { position: absolute; bottom: 0; left: 15%; right: 15%; height: 36%; background: linear-gradient(90deg, #8c4a2f, #c06a45 45%, #7a3d26); clip-path: polygon(0 0, 100% 0, 86% 100%, 14% 100%); border-top: 3px solid #a85a3a }
.plant .lf { position: absolute; bottom: 30%; left: 50%; width: 38%; height: 52%; border-radius: 100% 0; background: linear-gradient(135deg, #7fa66a, #3f6b3c); transform-origin: bottom left }
.plant .lf:nth-of-type(1) { transform: rotate(-58deg) } .plant .lf:nth-of-type(2) { transform: rotate(-12deg); height: 64% } .plant .lf:nth-of-type(3) { transform: rotate(32deg) scaleX(-1); left: 46% }
.flat { width: calc(64px * var(--k)); display: flex; flex-direction: column; gap: 1px }
.flat i { display: block; height: calc(11px * var(--k)); border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2) }
.flat i:nth-of-type(1) { background: #4d6b5a; width: 88%; margin-left: 6% } .flat i:nth-of-type(2) { background: #a3553a } .flat i:nth-of-type(3) { background: #c9a24a; width: 94% }
.bookend { width: calc(14px * var(--k)); height: 46%; background: linear-gradient(90deg, #8b6a2c, #e3be6a, #8b6a2c); border-radius: 3px 3px 0 0; margin-left: 3px }
.spacer { flex: 1 }
@media (max-width: 640px) { .plant { display: none } }

/* Foco del sorteo, dentro del mueble */
.spot { position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(calc(46px * var(--k) + 20px) calc(var(--rowh) * .9) at var(--sx, 50%) var(--sy, 50%), rgba(255,220,160,.12) 0, transparent 58%, rgba(6,4,2,.78) 100%) }
.case.lit .spot { opacity: 1 }
.case.shake { animation: shake .5s }
@keyframes shake { 20% { transform: translateX(-4px) rotate(-.3deg) } 40% { transform: translateX(4px) rotate(.3deg) } 60% { transform: translateX(-3px) } 80% { transform: translateX(2px) } }

/* Mascota sentada en lo alto del mueble */
.pet { position: absolute; right: 8px; bottom: calc(100% - var(--petsz) * .1); z-index: 8; width: var(--petsz); height: var(--petsz); pointer-events: none;
  transform: translateY(-40px); opacity: 0; transition: transform .7s cubic-bezier(.3,1.5,.5,1), opacity .3s }
.pet.in { transform: none; opacity: 1 }
.sprite { width: var(--petsz); height: var(--petsz); background-image: url(mascota.png); background-size: calc(var(--petsz) * 9) calc(var(--petsz) * 5); image-rendering: pixelated;
  background-position-y: calc(var(--row) * var(--petsz) * -1); animation: strip .9s steps(9) infinite }
@keyframes strip { from { background-position-x: 0 } to { background-position-x: calc(var(--petsz) * -9) } }
.sprite.idle { --row: 1 } .sprite.sad { --row: 3 } .sprite.joy { --row: 4 }
.pet.hop { animation: hop .5s 2 }
@keyframes hop { 50% { translate: 0 -14px } }
.bubble { position: absolute; right: calc(var(--petsz) - 4px); bottom: calc(100% + var(--petsz) * .45); z-index: 9; width: min(300px, calc(100% - var(--petsz) - 4px)); background: #fbf4e6; color: #2a1f15;
  border-radius: 16px 16px 4px 16px; padding: 10px 14px; font-size: 13.5px; line-height: 1.4; box-shadow: 0 10px 24px -8px rgba(0,0,0,.6);
  transform-origin: bottom right; transition: transform .25s cubic-bezier(.34,1.6,.64,1), opacity .2s }
.bubble.off { transform: scale(.4); opacity: 0 }
.bubble b { font-family: var(--f-display); font-weight: 600 }
@media (max-width: 640px) { .bubble { font-size: 12.5px; padding: 8px 12px } }

/* Pedestales delante del mueble */
.podium { position: absolute; inset: 0; z-index: 7; display: flex; justify-content: center; align-items: flex-end; gap: clamp(10px, 3vw, 30px); padding: 0 16px 60px }
.cand { width: clamp(84px, 26vw, 128px); position: relative; perspective: 900px; transition: transform .5s cubic-bezier(.34,1.3,.64,1), opacity .4s, filter .4s; }
.cand .flip { position: relative; aspect-ratio: 2/3; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.3,.5,1) }
.cand .face, .cand .back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 8px }
.cand .back { transform: rotateY(180deg); background: linear-gradient(90deg, var(--c1), var(--c2) 45%, var(--c1)); display: grid; place-items: center }
.cand .back::after { content: ""; width: 34%; height: 70%; border: 1.5px solid rgba(255,248,238,.4); border-radius: 4px }
.cand.hidden .flip { transform: rotateY(180deg) }
.cand .face .cover { position: absolute; inset: 0; border-radius: 8px; --cfs: clamp(11px, 2.4vw, 15px); box-shadow: 0 24px 40px -16px rgba(0,0,0,.9) }
.cand .ped { height: 14px; margin: 10px -10% 0; border-radius: 50%; background: radial-gradient(closest-side, rgba(224,169,74,.35), transparent) }
.cand.drop { animation: drop .6s cubic-bezier(.3,1.4,.5,1) both }
@keyframes drop { from { transform: translateY(-140%) rotate(-12deg); opacity: 0 } }
.cand.focus { transform: translateY(-10px) scale(1.06); filter: drop-shadow(0 0 18px rgba(224,169,74,.45)) }
.cand.dim { opacity: .38; filter: saturate(.5) }
.cand.pick .flip { box-shadow: 0 0 0 3px var(--st-gold); border-radius: 8px }
.cand .x { position: absolute; top: -10px; right: -10px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--st-line);
  background: var(--st-raise); display: none; place-items: center; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,.5) }
.discarding .cand .x { display: grid; animation: pop .3s backwards }
.discarding .cand:nth-of-type(2) .x { animation-delay: .08s } .discarding .cand:nth-of-type(3) .x { animation-delay: .16s }
@keyframes pop { from { transform: scale(0) } }
.cand.out { animation: stumble .8s ease-in forwards }

function applyAntojo(items, a) {

  const sorted = [...items].sort((x, y) => x.since.localeCompare(y.since));
  return sorted.slice(0, Math.max(3, Math.ceil(sorted.length / 3)));
}
function eligible(s, antojoId = s.antojo) {
  let items = POOL.filter(i => !s.started.has(i.id));
  if (s.type !== "all") items = items.filter(i => i.type === s.type);
  if (s.buckets.size < BUCKETS.length) items = items.filter(i => BUCKETS.some(b => s.buckets.has(b.id) && b.f(i.min)));
  const a = antojosFor(s.type).find(x => x.id === antojoId) || antojosFor(s.type)[0];
  return applyAntojo(items, a);
}
function shuffle(arr) { const c = [...arr]; for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }

// Motor de frases: el hecho más llamativo de cada candidato.
function lineFor(i) {
  const m = monthsAgo(i.since);
  const facts = [];
  if (m >= 12) facts.push(pick([`Te espera desde ${fmtSince(i.since)}. Paciencia de santo.`, `Lleva en tu balda desde ${fmtSince(i.since)}. Ya tiene polvo con nombre.`, `${m >= 24 ? "Más de dos años" : "Más de un año"} esperando su turno. ¿Hoy sí?`]));
  if (i.type !== "series" && i.min != null && i.min <= 150) facts.push(pick([`≈${fmtDur(i.min)} a tu ritmo: te cabe esta noche.`, `Solo ≈${fmtDur(i.min)}. Ni te enteras.`]));
  if (i.type === "series" && i.eps != null && i.eps <= 10) facts.push(pick([`${i.eps} episodios y fuera. Compromiso bajo.`, `Miniserie de ${i.eps}: un fin de semana y listo.`]));
  if (i.min != null && i.min > 600) facts.push(pick([`≈${fmtDur(i.min)}. Esto es una relación seria.`, `≈${fmtDur(i.min)} a tu ritmo. Trae merienda.`]));
  if (!i.fresh) facts.push(pick(["Ya os conocéis… ¿segunda oportunidad?", "Lo dejaste a medias una vez. Te guarda rencor, poco."]));
  if (i.fresh) facts.push(pick(["Primera vez. Nada de spoilers.", "Nunca lo has empezado. Todo por descubrir."]));
  if (!facts.length) facts.push({ book: "Un libro. Huele a nuevo.", movie: "Una película. Palomitas opcionales.", series: "Una serie. Avisa a tu sofá." }[i.type]);
  return facts[0];
}
const est = i => i.min != null ? `≈ ${fmtDur(i.min)} a tu ritmo` : "Sin estimación";
const meta = i => i.type === "series" && i.eps ? `${i.by} · Serie · ${i.eps} episodios` : `${i.by} · ${TYPE_LABEL[i.type]}`;
const CTA = { book: "Empezar a leer", movie: "Ver esta noche", series: "Empezar la T1" };

// ---------- vista ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const coverHTML = (i, fs) => `<div class="cover" style="--c1:${COLORS[i.type][0]};--c2:${COLORS[i.type][1]};${fs ? `--cfs:${fs}` : ""}"><div class="ct">${esc(i.t)}</div><div class="ca">${esc(i.by)}</div></div>`;
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

const st = { type: "all", antojo: "any", buckets: new Set(BUCKETS.map(b => b.id)), started: new Set(), phase: "idle", cands: [], winner: null, duelPick: null, timers: [], order: [] };
try { const saved = JSON.parse(localStorage.getItem("sorteo-proto") || "null"); if (saved) { st.type = saved.type || "all"; st.antojo = saved.antojo || "any"; } } catch {}
const save = () => { try { localStorage.setItem("sorteo-proto", JSON.stringify({ type: st.type, antojo: st.antojo })); } catch {} };
const later = (fn, ms) => { const id = setTimeout(fn, reduced() ? Math.min(ms, 120) : ms); st.timers.push(id); return id; };
const clearTimers = () => { st.timers.forEach(clearTimeout); st.timers = []; };
const currentAntojo = () => antojosFor(st.type).find(x => x.id === st.antojo) || antojosFor(st.type)[0];

function renderHome(freshId) {
  const pend = POOL.filter(i => !st.started.has(i.id)).sort((a, b) => b.since.localeCompare(a.since));
  $("laterCount").textContent = pend.length;
  $("later").innerHTML = pend.slice(0, 7).map(i => `<a class="item" href="#" onclick="return false">${coverHTML(i, "8px")}<span>${esc(i.t)}</span></a>`).join("") +
    `<button class="draw-btn" id="drawBtn" aria-label="Sacar un lomo: sortea tu próximo pendiente"><div class="stack"><div class="q">?</div><i class="sp"></i><i class="sp"></i><i class="sp"></i></div><span>¿Cuál toca?</span></button>`;
  $("drawBtn").onclick = openStage;
  $("now").innerHTML = NOW.map(i => `<div class="now-card ${i.id === freshId ? "fresh" : ""}"><div class="cover" style="--c1:${COLORS[i.type][0]};--c2:${COLORS[i.type][1]};--cfs:7px"><div class="ct">${esc(i.t)}</div></div><div style="flex:1;min-width:0"><b>${esc(i.t)}</b><small>${esc(i.sub)}</small><div class="bar"><i style="width:${i.pct}%"></i></div></div></div>`).join("");
}

// ---------- el mueble ----------
function spineHTML(i, lean) {
  const shades = SHADES[i.type];
  const c = shades[i.id % shades.length];
  // Grosor = tiempo a tu ritmo (los tochos se notan en la balda).
  let w = i.min == null ? 26 : Math.round(20 + Math.min(i.min / 60, 12) * 1.7);
  if (i.type === "series") w = Math.max(w, 32);
  const h = 66 + (i.id * 37) % 30;
  const seasons = i.eps ? Math.max(1, Math.round(i.eps / 9)) : 1;
  const inner = i.type === "book"
    ? `<i class="band"></i><i class="band"></i><span class="tt">${esc(i.t)}</span><i class="band"></i><span class="au">${esc(initials(i.by))}</span>`
    : i.type === "movie"
      ? `<span class="cap">▶</span><span class="tt">${esc(i.t)}</span><span class="au">${esc(initials(i.by))}</span>`
      : `<span class="tt">${esc(i.t)}</span><span class="au">${seasons > 1 ? `T1–${seasons}` : "T1"}</span>`;
  return `<div class="bk ${i.type}${lean ? " lean" : ""}" data-id="${i.id}" title="${esc(i.t)}" style="--w:${w}px;--h:${h}%;--c:${c}">${inner}</div>`;
}
const PLANT = `<div class="dc plant" aria-hidden="true"><i class="lf"></i><i class="lf"></i><i class="lf"></i><b class="pot"></b></div>`;
const FLAT = `<div class="dc flat" aria-hidden="true"><i></i><i></i><i></i></div>`;
const BOOKEND = `<div class="dc bookend" aria-hidden="true"></div>`;
function buildCase() {
  const items = st.order.map(id => POOL.find(p => p.id === id)).filter(i => !st.started.has(i.id)).slice(0, 24);
  const half = Math.ceil(items.length / 2);
  const r1 = items.slice(0, half), r2 = items.slice(half);
  $("rows").innerHTML =
    `<div class="row">${r1.map(i => spineHTML(i)).join("")}${BOOKEND}<span class="spacer"></span>${PLANT}</div><div class="lip"></div>` +
    `<div class="row">${FLAT}${r2.map((i, k) => spineHTML(i, k === r2.length - 1)).join("")}<span class="spacer"></span></div><div class="lip"></div>`;
}
const spines = () => [...$("rows").querySelectorAll(".bk")];
function applyDims() {
  const ok = new Set(eligible(st).map(i => i.id));
  spines().forEach(s => s.classList.toggle("off", !ok.has(+s.dataset.id)));
}
function motes() {
  if (reduced()) { $("motes").innerHTML = ""; return; }
  $("motes").innerHTML = Array.from({ length: 14 }, () => `<i style="left:${Math.random() * 100}%;top:${40 + Math.random() * 55}%;--dx:${Math.random() * 40 - 20}px;animation-duration:${7 + Math.random() * 7}s;animation-delay:${-Math.random() * 10}s"></i>`).join("");
}

// ---------- mascota ----------
function say(html, mood = "idle") {
  const b = $("bubble"); b.classList.add("off");
  later(() => { b.innerHTML = html; b.classList.remove("off"); }, 140);
  mood_(mood);
}
function mood_(m) { $("sprite").className = "sprite " + m; if (m === "joy") { $("pet").classList.remove("hop"); void $("pet").offsetWidth; $("pet").classList.add("hop"); } }
const hush = () => $("bubble").classList.add("off");
function setPhase(p, lbl) { st.phase = p; $("phaseLbl").textContent = lbl || ""; $("scene").classList.toggle("choosing", p === "choose"); }

// ---------- fase: antes de tirar ----------
function pillHTML() {
  const a = currentAntojo(); const n = eligible(st).length;
  const label = st.type === "all" ? a.t : `${TYPE_PLURAL[st.type]} · ${a.t}`;
  const tuned = st.type !== "all" || st.antojo !== "any" || st.buckets.size < BUCKETS.length;
  return `<span class="ic" aria-hidden="true">${a.ic}</span><span><b>${esc(label)}</b><small>${n} ${n === 1 ? "lomo" : "lomos"} en juego${tuned ? "" : " · Afinar"}</small></span><span class="chev" aria-hidden="true">▾</span>`;
}
function renderChoose() {
  setPhase("choose", "");
  $("st").classList.remove("compact");
  $("podium").hidden = true; $("podium").className = "podium";
  $("case").classList.remove("dim", "lit");
  spines().forEach(s => s.classList.remove("pulled", "taken", "tick"));
  applyDims();
  const n = eligible(st).length;
  $("ctrl").innerHTML = `<div class="mainbar"><button class="pill" id="pill" aria-haspopup="dialog" aria-label="Afinar la tirada">${pillHTML()}</button><button class="cta big" id="roll" ${n ? "" : "disabled"}>¡Tirar!</button></div>`;
  $("pill").onclick = openTune;
  $("roll").onclick = roll;
}
function refreshChoose() {
  applyDims();
  if ($("pill")) $("pill").innerHTML = pillHTML();
  if ($("roll")) $("roll").disabled = eligible(st).length === 0;
}
function sayChoose() {
  const n = eligible(st).length;
  if (!n) say("Así no queda nadie. <b>Afloja algo</b> y vuelvo a mirar.", "sad");
  else if (n <= 2) say(`Solo ${n === 1 ? "queda <b>uno</b>" : "quedan <b>dos</b>"}. Poca emoción, pero vale.`);
  else say(`<b>${n} lomos</b> en juego. Cuando quieras, tira.`);
}

// Panel «Afinar»: opcional y plegado; los cambios se ven en vivo en la balda.
function renderTune() {
  const list = antojosFor(st.type);
  if (!list.some(a => a.id === st.antojo)) st.antojo = "any";
  const total = POOL.length - st.started.size; const n = eligible(st).length;
  $("tune").innerHTML = `
    <div class="tune-head"><h3>Afinar la tirada</h3><button class="cta" id="tuneDone" style="flex:none;padding:9px 20px;font-size:14px">Listo</button></div>
    <div class="types" role="group" aria-label="Qué te apetece">
      ${[["all", "Todo"], ["book", "Libros"], ["movie", "Películas"], ["series", "Series"]].map(([v, l]) =>
        `<button class="chip" data-type="${v}" aria-pressed="${st.type === v}">${v !== "all" ? `<span class="dot" style="background:${COLORS[v][1]}"></span>` : ""}${l}</button>`).join("")}
    </div>
    <div class="antojos">
      ${list.map(a => { const k = eligible(st, a.id).length; return `<button class="antojo" data-a="${a.id}" aria-pressed="${st.antojo === a.id}" ${k ? "" : "disabled"}><span class="ic" aria-hidden="true">${a.ic}</span><b>${esc(a.t)}</b><small>${k ? esc(a.d) : "Nada aquí ahora"}</small><span class="n">${k} ${k === 1 ? "lomo" : "lomos"}</span></button>`; }).join("")}
    </div>
    <p class="tlabel">Cuánto tiempo (a tu ritmo)</p>
    <div class="trow">${BUCKETS.map(b => `<button class="tchk" data-b="${b.id}" aria-pressed="${st.buckets.has(b.id)}">${b.t}</button>`).join("")}</div>
    <div class="sumrow"><span>Sorteando entre <strong>${n}</strong> de tus ${total} pendientes</span><button class="ghost" id="reset">Restablecer</button></div>`;
  const t = $("tune");
  t.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { st.type = b.dataset.type; save(); renderTune(); refreshChoose(); });
  t.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { st.antojo = b.dataset.a; save(); renderTune(); refreshChoose(); });
  t.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { const id = b.dataset.b; if (st.buckets.has(id)) { if (st.buckets.size > 1) st.buckets.delete(id); } else st.buckets.add(id); renderTune(); refreshChoose(); });
  $("reset").onclick = () => { st.type = "all"; st.antojo = "any"; st.buckets = new Set(BUCKETS.map(b => b.id)); save(); renderTune(); refreshChoose(); };
  $("tuneDone").onclick = closeTune;
}
function openTune() { renderTune(); hush(); $("tune").classList.add("on"); $("tune").setAttribute("aria-hidden", "false"); later(() => $("tuneDone").focus(), 50); }
function closeTuneSilently() { $("tune").classList.remove("on"); $("tune").setAttribute("aria-hidden", "true"); }
function closeTune() { closeTuneSilently(); sayChoose(); $("pill")?.focus(); }

// ---------- fase: tirada ----------
function roll() {
  const items = eligible(st);
  if (!items.length) return;
  closeTuneSilently();
  st.cands = shuffle(items).slice(0, Math.min(3, items.length));
  setPhase("roll", "Tirada");
  hush(); mood_("idle");
  $("ctrl").innerHTML = `<p class="hint">Barajando la balda…</p><button class="ghost" id="skip" style="align-self:center">Saltar al duelo</button>`;
  $("skip").onclick = () => { clearTimers(); $("case").classList.remove("lit"); spines().forEach(s => s.classList.remove("tick")); if (st.cands.length > 2) st.cands = st.cands.slice(0, 2); takeOut(true); st.cands.length === 2 ? startDuel() : reveal(st.cands[0]); };
  const live = spines().filter(s => !s.classList.contains("off"));
  const caseEl = $("case");
  caseEl.classList.remove("shake"); void caseEl.offsetWidth; caseEl.classList.add("shake");
  if (reduced()) { takeOut(true); return later(present, 200); }
  caseEl.classList.add("lit");
  let step = 0, delay = 45, elapsed = 0;
  const tick = () => {
    const cr = caseEl.getBoundingClientRect();
    live.forEach(s => s.classList.remove("tick"));
    const s = live[step % live.length]; s.classList.add("tick");
    const r = s.getBoundingClientRect();
    caseEl.style.setProperty("--sx", `${r.left - cr.left + r.width / 2}px`);
    caseEl.style.setProperty("--sy", `${r.top - cr.top + r.height / 2}px`);
    step++; elapsed += delay; delay = Math.min(delay * 1.12, 200);
    if (elapsed < 1600) later(tick, delay);
    else { live.forEach(s => s.classList.remove("tick")); caseEl.classList.remove("lit"); takeOut(false); later(present, 1150); }
  };
  later(tick, 300);
}
// Los tres elegidos asoman y salen de la balda, uno tras otro; dejan su hueco.
function takeOut(instant) {
  st.cands.forEach((c, k) => {
    const s = $("rows").querySelector(`.bk[data-id="${c.id}"]`); if (!s) return;
    if (instant) { s.classList.add("taken"); return; }
    later(() => s.classList.add("pulled"), k * 260);
    later(() => s.classList.add("taken"), k * 260 + 420);
  });
}

function candHTML(i, idx) {
  return `<div class="cand hidden drop" data-i="${idx}" style="animation-delay:${idx * 120}ms;--c1:${COLORS[i.type][0]};--c2:${COLORS[i.type][1]}">
    <button class="x" aria-label="Devolver ${esc(i.t)} a la balda">✕</button>
    <div class="flip"><div class="face">${coverHTML(i)}</div><div class="back"></div></div><div class="ped"></div>
    <div class="tag"><b>${esc(i.t)}</b>${esc(est(i))}</div></div>`;
}

// ---------- fase: presentación ----------
function present() {
  setPhase("present", "Candidatos");
  $("case").classList.add("dim");
  const pod = $("podium"); pod.hidden = false; pod.className = "podium";
  pod.innerHTML = st.cands.map(candHTML).join("");
  const nodes = [...pod.querySelectorAll(".cand")];
  nodes.forEach(n => n.querySelector(".tag").style.opacity = 0);
  $("ctrl").innerHTML = `<p class="hint">Presentando a los candidatos…</p><button class="ghost" id="skip" style="align-self:center">Saltar presentación</button>`;
  let k = 0;
  $("skip").onclick = () => { clearTimers(); nodes.forEach(n => { n.classList.remove("hidden", "focus", "dim"); n.querySelector(".tag").style.opacity = 1; }); afterPresent(); };
  const next = () => {
    if (k >= nodes.length) return later(afterPresent, 300);
    nodes.forEach((n, j) => { n.classList.toggle("focus", j === k); n.classList.toggle("dim", j !== k && !n.classList.contains("hidden")); });
    const n = nodes[k]; n.classList.remove("hidden"); n.querySelector(".tag").style.opacity = 1;
    const c = st.cands[k];
    say(`<b>${esc(c.t)}</b>. ${esc(lineFor(c))}`);
    k++; later(next, 2300);
  };
  later(next, 750);
}
function afterPresent() {
  [...$("podium").querySelectorAll(".cand")].forEach(n => n.classList.remove("focus", "dim", "drop"));
  if (st.cands.length === 1) return later(() => reveal(st.cands[0], true), 400);
  if (st.cands.length === 2) return startDuel();
  setPhase("discard", "Descarte");
  $("podium").classList.add("discarding");
  say("Tres son multitud. <b>Uno se vuelve a la balda.</b> ¿Cuál?");
  $("ctrl").innerHTML = `<p class="hint">Toca la ✕ del que <strong>no</strong> te apetece hoy.</p>`;
  $("podium").querySelectorAll(".x").forEach(x => x.onclick = e => {
    e.stopPropagation();
    const node = x.closest(".cand"); const idx = +node.dataset.i; const gone = st.cands[idx];
    $("podium").classList.remove("discarding");
    node.classList.add("out");
    // Vuelve a su hueco en la balda.
    later(() => $("rows").querySelector(`.bk[data-id="${gone.id}"]`)?.classList.remove("taken", "pulled"), 500);
    say(`Pobre <b>${esc(gone.t)}</b>… ${pick(["otra vez será.", "vuelve a su sitio con dignidad.", "dice que no pasa nada. Pasa."])}`, "sad");
    later(() => { st.cands = st.cands.filter((_, j) => j !== idx); startDuel(); }, 1300);
  });
}

// ---------- fase: duelo ----------
function startDuel() {
  setPhase("duel", "Duelo");
  st.duelPick = null;
  const [a, b] = st.cands;
  $("case").classList.add("dim");
  const pod = $("podium"); pod.hidden = false; pod.className = "podium";
  pod.innerHTML = candHTML(a, 0) + `<div class="vs" aria-hidden="true">vs</div>` + candHTML(b, 1);
  pod.querySelectorAll(".cand").forEach(n => { n.classList.remove("hidden", "drop"); n.style.animation = "none"; });
  requestAnimationFrame(() => pod.classList.add("duel"));
  say("Cara a cara. <b>¿Lo dejamos a la suerte</b> o ya lo tienes claro?", "idle");
  $("ctrl").innerHTML = `<div class="btnrow"><button class="cta" id="luck">🎲 Que decida la suerte</button><button class="sec" id="mine" disabled>Me quedo con este</button></div><p class="hint">O toca uno de los dos para elegirlo tú.</p>`;
  const nodes = [...pod.querySelectorAll(".cand")];
  nodes.forEach((n, j) => n.onclick = () => {
    if (st.phase !== "duel") return;
    st.duelPick = j; nodes.forEach((m, q) => m.classList.toggle("pick", q === j));
    $("mine").disabled = false; $("mine").textContent = `Me quedo con «${st.cands[j].t}»`;
  });
  $("mine").onclick = () => { if (st.duelPick != null) { say(pick(["Decidido. <b>Me gusta tu estilo.</b>", "Sin titubeos. <b>Así se hace.</b>"]), "joy"); later(() => reveal(st.cands[st.duelPick]), 700); } };
  $("luck").onclick = () => {
    setPhase("duel-luck", "Duelo");
    $("luck").disabled = true; $("mine").disabled = true; nodes.forEach(n => n.classList.remove("pick"));
    hush();
    const w = Math.floor(Math.random() * 2);
    let s = 0, delay = 70, el = 0;
    const flick = () => {
      const j = s % 2; nodes.forEach((n, q) => { n.classList.toggle("focus", q === j); n.classList.toggle("dim", q !== j); });
      s++; el += delay; delay = Math.min(delay * 1.18, 520);
      if (el > 1700 && j === w) return later(() => reveal(st.cands[w]), 650);
      later(flick, delay);
    };
    if (reduced()) return later(() => reveal(st.cands[w]), 200);
    flick();
  };
}

// ---------- fase: revelación ----------
function reveal(c, solo) {
  setPhase("reveal", "¡Tenemos lomo!");
  st.winner = c;
  $("st").classList.add("compact");
  $("case").classList.add("dim");
  const pod = $("podium"); pod.hidden = false; pod.className = "podium reveal";
  pod.innerHTML = candHTML(c, 0);
  const n = pod.querySelector(".cand"); n.classList.add("win"); n.classList.remove("drop"); n.querySelector(".tag").remove();
  requestAnimationFrame(() => n.classList.remove("hidden"));
  confetti();
  say(solo ? `Solo me quedas tú, <b>${esc(c.t)}</b>. ${esc(lineFor(c))}` : `¡<b>${esc(c.t)}</b>! ${esc(lineFor(c))}`, "joy");
  $("ctrl").innerHTML = `<div class="result"><h3>${esc(c.t)}</h3><span class="meta">${esc(meta(c))}</span><span class="est">${esc(est(c))}</span></div>
    <button class="cta big" id="go">${CTA[c.type]}</button>
    <div class="btnrow"><button class="sec" id="again">↻ Otra partida</button><button class="sec" id="ficha">Ver ficha</button></div>`;
  $("go").onclick = () => start(c);
  $("again").onclick = () => { clearTimers(); renderChoose(); sayChoose(); };
  $("ficha").onclick = () => toast(`(Prototipo) Iría a la ficha de «${c.t}»`);
}
function confetti() {
  if (reduced()) return;
  const box = $("confetti"); box.innerHTML = "";
  const cols = ["#cf8a54", "#e0a94a", "#6bb0b4", "#b592bd", "#d97a63", "#f0e8db"];
  for (let k = 0; k < 46; k++) {
    const i = document.createElement("i");
    i.style.left = Math.random() * 100 + "%"; i.style.background = cols[k % cols.length];
    i.style.height = 12 + Math.random() * 14 + "px";
    i.style.setProperty("--dy", 500 + Math.random() * 300 + "px"); i.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    i.style.animationDuration = 1.3 + Math.random() * 1.2 + "s"; i.style.animationDelay = Math.random() * .3 + "s";
    box.appendChild(i);
  }
  later(() => box.innerHTML = "", 3000);
}

// Salida: crea el pase, cierra y deja el Inicio actualizado
function start(c) {
  const b = $("go"); b.disabled = true; b.textContent = "Un momento…";
  later(() => {
    b.textContent = "✓ En curso";
    say(pick(["¡A disfrutarlo! Te lo dejo en <b>Continúa</b>.", "Hecho. <b>Ya está en tu Inicio.</b>"]), "joy");
    later(() => {
      st.started.add(c.id);
      NOW.unshift({ id: c.id, type: c.type, t: c.t, by: c.by, pct: 2, sub: c.type === "book" ? "Recién empezado" : c.type === "movie" ? "Para esta noche" : "T1 · E1" });
      closeStage(); renderHome(c.id);
      toast(`Empezaste «${c.t}»`);
      window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
    }, 1300);
  }, 500);
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600); }

// Abrir / cerrar: telón mientras «carga» el pool (en la app: server action)
function openStage() {
  clearTimers();
  st.order = shuffle(POOL.map(p => p.id));
  $("curtain").classList.remove("open", "gone"); $("pet").classList.remove("in"); hush(); closeTuneSilently();
  $("ctrl").innerHTML = ""; $("podium").hidden = true; $("phaseLbl").textContent = ""; $("st").classList.remove("compact");
  buildCase(); motes();
  $("stage").showModal();
  later(() => {
    $("curtain").classList.add("open"); later(() => $("curtain").classList.add("gone"), 800);
    renderChoose();
    later(() => { $("pet").classList.add("in"); later(() => say("¿Tiro sin más? <b>Pulsa ¡Tirar!</b> Si buscas algo concreto, afina abajo."), 600); }, 350);
  }, 700);
}
function closeStage() { clearTimers(); $("stage").close(); }
$("close").onclick = () => { if ($("tune").classList.contains("on")) closeTune(); else closeStage(); };
$("stage").addEventListener("cancel", e => { if ($("tune").classList.contains("on")) { e.preventDefault(); closeTune(); } });
$("stage").addEventListener("close", clearTimers);
$("stage").addEventListener("click", e => { if (e.target === $("stage")) closeStage(); });

renderHome();
})();
</script>
