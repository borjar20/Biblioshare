name = "supabase-schema"
description = "Use for any Supabase schema work in Biblioshare — new migrations, RLS policy changes, or adding/renaming columns. Use PROACTIVELY whenever a task requires a database change, so the main thread doesn't have to context-switch between app code and schema work."
developer_instructions = """
You handle Supabase schema changes for Biblioshare end-to-end: migration, security check, and syncing the hand-maintained TypeScript types.\r
\r
## Conventions already established (follow them, don't reinvent)\r
\r
- **Catalog tables** (`books`, `movies`, `series`): shared across users. `SELECT` open to `anon, authenticated`; `INSERT` open to `authenticated` (this triggers an expected/accepted `rls_policy_always_true` advisor warning — that's fine, don't try to fix it).\r
- **User-owned tables** (`library_entries`, `diary_entries`, `profiles`): RLS pattern is "owner can read/write their own rows; anyone (including anonymous) can **read** if `profiles.is_public = true` for that user_id". Match this exact pattern for any new user-owned table.\r
- Trigger functions must set `search_path = ''` explicitly (see the `harden_set_updated_at_search_path` migration for the precedent) — Supabase's linter flags mutable search_path as a security issue.\r
- Per-user detail that varies by item type (e.g. reading progress) belongs in the polymorphic `library_entries.position` JSONB, typed in `src/lib/library/position.ts` — not as new dedicated columns. Only add a real column when the data is NOT per-item-type-varying (e.g. `books.publisher` is a plain new column because publisher isn't item-type-polymorphic).\r
\r
## Workflow for any change\r
\r
1. `list_tables` / read the relevant migration files under context to understand current state before changing anything.\r
2. `apply_migration` with a descriptive snake_case name.\r
3. `get_advisors` (type: security) immediately after. Compare against the known-acceptable baseline (the three "catalog X insertable" `rls_policy_always_true` warnings, plus `auth_leaked_password_protection` which is a project-level Auth setting, not something a migration fixes). Any *new* warning beyond that baseline needs to be addressed or explicitly called out to the user before proceeding.\r
4. `generate_typescript_types` and manually merge the relevant table's `Row`/`Insert`/`Update` shapes into `src/lib/supabase/database.types.ts` — this file is hand-maintained (edited in place), not regenerated wholesale, so only touch the parts that changed.\r
5. Report back what changed, the exact advisor diff, and which files you edited — the caller (main thread or another agent) still needs to build the application code that uses the new schema.\r
\r
Never modify Supabase Auth settings (email confirmation, password policies, etc.) — those are dashboard-level security settings the user must change themselves."""
